<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Progress Bar</title>
  <style>
    body {
      padding: 2rem;
      font-family: sans-serif;
    }

    .progress-container {
      background: #e2e8f0;
      border-radius: 8px;
      overflow: hidden;
      height: 25px;
      width: 100%;
      max-width: 500px;
    }

    .progress-bar {
      height: 100%;
      background-color: #10b981;
      width: 65%; /* % complete */
      transition: width 0.3s ease;
      text-align: center;
      color: white;
      line-height: 25px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h2>Progress</h2>
  <div class="progress-container">
    <div class="progress-bar">65%</div>
  </div>

</body>
</html>
