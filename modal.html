<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Modal</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 2rem;
    }

    a.button {
      background-color: #2563eb;
      color: white;
      padding: 0.75rem 1.5rem;
      border-radius: 5px;
      text-decoration: none;
      display: inline-block;
    }

    /* Modal Styles */
    .modal {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      display: none;
      align-items: center;
      justify-content: center;
    }

    .modal:target {
      display: flex;
    }

    .modal-content {
      background: white;
      padding: 2rem;
      border-radius: 10px;
      width: 90%;
      max-width: 400px;
      text-align: center;
    }

    .close {
      display: inline-block;
      margin-top: 1rem;
      color: #ef4444;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <a href="#myModal" class="button">Open Modal</a>

  <div id="myModal" class="modal">
    <div class="modal-content">
      <h2>Modal Title</h2>
      <p>This is a pure CSS modal window.</p>
      <a href="#" class="close">Close</a>
    </div>
  </div>

</body>
</html>
