<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image & Text</title>
  <style>
    body {
      margin: 0;
      padding: 2rem;
    }

    .container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
      align-items: center;
    }

    .text h2 {
      margin-top: 0;
      margin-bottom: 1rem;
    }

    .text p {
      line-height: 1.6;
      color: #374151;
    }

    .image img {
      width: 100%;
      border-radius: 10px;
      display: block;
    }

    @media (max-width: 768px) {
      .container {
        grid-template-columns: 1fr;
      }

      .image, .text {
        text-align: center;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="text">
      <h2>Meet Our Team</h2>
      <p>
        We’re a group of dedicated professionals bringing ideas to life through quality software and thoughtful design.
        Collaboration and creativity drive everything we do.
      </p>
    </div>
    <div class="image">
      <img src="download.jpeg" alt="Team Photo">
    </div>
  </div>

</body>
</html>
