<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Navbar with Dropdown</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
    }

    nav {
      background-color: #1e293b;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      flex-wrap: wrap;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: bold;
    }

    .menu {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
    }

    .menu a {
      text-decoration: none;
      color: white;
      font-weight: 500;
      padding: 0.5rem;
      display: inline-block;
    }

    .menu a:hover {
      color: #38bdf8;
    }

    .menu-item {
      position: relative;
    }

    .dropdown {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      background-color: darkblue;
      min-width: 160px;
      border-radius: 0.25rem;
      box-shadow: 0 4px 8px darkslateblue;
      z-index: 10;
    }

    .dropdown a {
      display: block;
      padding: 0.75rem 1rem;
      color: #f1f5f9;
      white-space: nowrap;
    }

    .dropdown a:hover {
      background-color: darkslateblue;
    }

    .menu-item:hover .dropdown {
      display: block;
    }

    @media (max-width: 600px) {
      nav {
        flex-direction: column;
        align-items: flex-start;
      }

      .menu {
        flex-direction: column;
        width: 100%;
      }

      .menu-item {
        width: 100%;
      }

      .dropdown {
        position: static;
        box-shadow: none;
        background-color: darkslateblue;
      }

      .dropdown a {
        padding-left: 2rem;
      }
    }
  </style>
</head>
<body>

  <nav>
    <div class="logo">My Portfolio</div>
    <div class="menu">
      <div class="menu-item">
        <a href="#">Home</a>
      </div>
      <div class="menu-item">
        <a href="#">About</a>
      </div>
      <div class="menu-item">
        <a href="#">Services ▾</a>
        <div class="dropdown">
          <a href="#">Web Design</a>
          <a href="#">Software Development</a>
          <a href="#">Consulting</a>
        </div>
      </div>
      <div class="menu-item">
        <a href="#">Contact</a>
      </div>
    </div>
  </nav>

</body>
</html>
