<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Accordion</title>
  <style>
    body {
      padding: 2rem;
      font-family: sans-serif;
    }

    details {
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 5px;
      margin-bottom: 1rem;
      padding: 0.5rem 1rem;
    }

    summary {
      cursor: pointer;
      font-weight: bold;
      padding: 0.5rem 0;
    }

    details[open] summary {
      color: #2563eb;
    }
  </style>
</head>
<body>

  <details>
    <summary>What is your refund policy?</summary>
    <p>We offer full refunds within 14 days of purchase.</p>
  </details>

  <details>
    <summary>How do I access my account?</summary>
    <p>Click on "Login" at the top right of the page.</p>
  </details>

</body>
</html>
