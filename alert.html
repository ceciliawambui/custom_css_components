<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Alerts</title>
  <style>
    body {
      padding: 2rem;
      font-family: sans-serif;
    }

    .alert {
      padding: 1rem 1.5rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      color: white;
    }

    .success { background-color: #10b981; }
    .info    { background-color: #3b82f6; }
    .warning { background-color: #facc15; color: black; }
    .error   { background-color: #ef4444; }
  </style>
</head>
<body>

  <div class="alert success">✅ Success! Your action was completed.</div>
  <div class="alert info">ℹ️ Info! Read more details here.</div>
  <div class="alert warning">⚠️ Warning! Check your input.</div>
  <div class="alert error">❌ Error! Something went wrong.</div>

</body>
</html>
