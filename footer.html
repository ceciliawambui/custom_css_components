<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Footer</title>
    <style>
        body {
            margin: 0;
            padding: 0;
        }
        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 10px 0;
            left: 0;
            bottom: 0;
            width: 100%;
            position: fixed;
        }
        .navbar {
            margin-top: 1rem;
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            flex-wrap: wrap;
        }
        .navbar a {
            color: gray;
            text-decoration: none;
        }
        .navbar a:hover {
            color: chocolate;
        }
    </style>
</head>

<body>
    <footer>
        <p>&copy 2025 Eagles. All rights reserved.</p>
        <div class="navbar">
            <a href="#">Privacy Policy</a>
            <a href="#">Terms</a>
            <a href="#">Help</a>
        </div>
    </footer>

</body>

</html>
