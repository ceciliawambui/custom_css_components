<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar</title>
    <style>
        body{
            margin: 0;
            padding: 0;
        }
        nav{
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            background-color: black;
            color: white;
            padding: 1rem 2rem;
    
        }
        .logo{
            font-size: 1.5rem;
            font-weight: bold;


        }
        .navbar{
            display: flex;
            gap: 1.5rem;

        }
    
        .navbar a{
            text-decoration: none;
            color: white;
        }
        .navbar a:hover{
            color: chocolate;
        }
        @media (max-width:600px){
            .navbar{
                flex-direction: column;
                width: 100%;
                margin-top: 1rem;
            }
        }
    </style>
</head>

<body>
    <nav>
        <div class="logo">My Portfolio</div>
        <div class="navbar">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Education</a>
            <a href="#">Experience</a>
            <a href="#">Contact</a>
        </div>
    </nav>
</body>

</html>
