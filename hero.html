<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hero Section</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
    }

    .hero {
      background: linear-gradient(to right, #1e3a8a, #2563eb);
      color: white;
      text-align: center;
      padding: 4rem 2rem;
    }

    .hero h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }

    .hero p {
      font-size: 1.2rem;
      margin-bottom: 2rem;
    }

    .hero a {
      background-color: white;
      color: #2563eb;
      text-decoration: none;
      padding: 0.75rem 1.5rem;
      border-radius: 5px;
      font-weight: bold;
    }

    .hero a:hover {
      background-color: #e0e7ff;
    }
  </style>
</head>
<body>

  <section class="hero">
    <h1>Build Amazing Websites</h1>
    <p>Design. Develop. Deploy. Repeat.</p>
    <a href="#">Get Started</a>
  </section>

</body>
</html>
