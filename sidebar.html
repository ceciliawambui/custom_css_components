<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidebar</title>
    <style>
        body{
            margin: 0;
            display:flex;
            flex-direction: row;
            gap: 3rem;         
        }
        aside{
            background-color: black;
            color: beige;
            padding: 1rem;
            height: 100vh;
            width: 200px;
        }
        ul{
            list-style: none;
        }
        aside ul li{
            padding: 0.5rem 0;
        }
        aside h2{
            margin-bottom: 1rem;
        }
        aside ul li:hover{
            color: chocolate;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <aside>
        <h2>Eagles.</h2>
        <ul>
            <li>Dashboard</li>
            <li>Profile</li>
            <li>Settings</li>
            <li>Logout</li>
        </ul>
    </aside>
    <main>
        <h1>Main content section</h1>
    </main>
    
</body>
</html>
