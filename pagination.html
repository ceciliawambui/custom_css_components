<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pagination</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 2rem;
    }

    .pagination {
      display: flex;
      list-style: none;
      gap: 0.5rem;
      justify-content: center;
      padding: 0;
    }

    .pagination li {
      padding: 0.5rem 1rem;
      border: 1px solid #cbd5e1;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .pagination li:hover {
      background-color: #e2e8f0;
    }

    .pagination .active {
      background-color: #2563eb;
      color: white;
      border-color: #2563eb;
    }
  </style>
</head>
<body>

  <ul class="pagination">
    <li>&laquo;</li>
    <li>1</li>
    <li class="active">2</li>
    <li>3</li>
    <li>4</li>
    <li>&raquo;</li>
  </ul>

</body>
</html>
