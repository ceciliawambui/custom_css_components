<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Card</title>
   <style>
       .card{
           border: 1px solid #e2e8f0;
           border-radius: 10px;
           padding: 5px;
           margin: 10px;
           width: 300px;
           box-shadow:0 4px 6px rgba(0, 0, 0, 0.1) ;
       }


   </style>
</head>
<body>
   <div class="card">
       <img src="download.jpeg" alt="Card">
       <div>
           <h3>Card Title</h3>
           <p>This is a sample card with an image, title and description</p>
       </div>
   </div>
  
</body>
</html>
